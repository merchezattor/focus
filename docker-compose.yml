# Focus — full stack for self-hosting without Dokploy.
#
#   1. cp .env.docker.example .env   # then fill in the secrets
#   2. docker compose up --build -d
#
# Three services on one origin: Caddy (web) serves the SPA and reverse-proxies
# /api to the Hono API, which migrates the database on startup once it's healthy.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-focus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Exposed so you can inspect the DB or run the app against it from the host.
    # Comment out to keep Postgres reachable only on the internal compose network.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-focus} -d ${POSTGRES_DB:-focus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Host is the `db` service name on the compose network — NOT localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-focus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-focus}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # Public origin the app is reached on (no trailing slash). Drives the
      # auth cookie's Secure flag (https -> Secure) and the trusted origin.
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${APP_PORT:-3000}:80"

volumes:
  pgdata:
