name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      # Version comes from .nvmrc (keep in sync with the Dockerfile).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The Vite plugin regenerates routeTree.gen.ts during the build.
      # A diff means routes changed without the regenerated tree committed.
      - name: Build web
        run: pnpm --filter @focus/web build

      - name: Route tree is up to date
        run: git diff --exit-code apps/web/src/routeTree.gen.ts
