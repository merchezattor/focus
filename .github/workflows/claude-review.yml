name: Claude PR Review

# Reviews a PR once: when it is opened, marked ready for review, or reopened.
# Add `synchronize` to the types below to re-review on every push (costs more).
# For an on-demand re-review, comment `@claude review again` (see claude.yml).

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and PRs from forks (they don't receive repo secrets anyway).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review PR with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing this pull request. Read CLAUDE.md first, especially
            its "Code review" section, and apply those project rules.

            Get the change with `gh pr diff` and `gh pr view`. Read surrounding
            code in the checkout when you need context to judge a change.

            Report ONLY real problems, ranked by severity:
            - [P0]: will break production, lose or corrupt data, or open a security hole.
            - [P1]: a correctness bug or a violation of a CLAUDE.md review rule.
            Do NOT comment on style, formatting, naming, or anything Biome would
            catch. Do not suggest refactors or praise. If you are not confident a
            finding is real, leave it out.

            For each finding, post an inline comment on the exact line with
            mcp__github_inline_comment__create_inline_comment. Start the comment
            with its tag ([P0] or [P1]) and say what breaks and under what
            conditions.

            Finish with exactly ONE summary comment via `gh pr comment`: the
            number of P0/P1 findings and a one-line list of them, or
            "No blocking issues found." if there are none.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
